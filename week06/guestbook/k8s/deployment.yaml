apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  namespace: week10
spec:
  replicas: 5
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: web
          image: ghcr.io/besin012/guestbook:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
