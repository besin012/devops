apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/besin012/devops.git
    targetRevision: main
    path: week13/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: week13
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
